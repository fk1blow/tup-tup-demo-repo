name: my-pipeline
jobs:
  - name: install
    image: oven/bun:1.3.7
    commands:
      - ["bun", "install"]
  - name: build
    image: oven/bun:1.3.7
    commands:
      - ["bun", "run", "build"]
    dependsOn:
      - "install"
  - name: test
    image: oven/bun:1.3.7
    commands:
      - ["bun", "test"]
    dependsOn:
      - "install"
